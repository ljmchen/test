# p3_joint_rot — 联合双手 flow 去噪 (A1) + 旋转损失包（T2+T3），从零正式训练草稿。
# 动机：逐手自回归下手2只透过一个 prev-hand token 看手1，rel_r≈1.99 纹丝不动
# （lgbidex 第二大失败 right_release_failure ~25% 的结构性根因）。joint 模式让
# 在场手共享同一 t、以多 query 在每个 ODE 步互相 attend，直接建模手间联合分布；
# prev-hand token 在 joint 路径弃用（被 query 间注意力取代），h_0/h_1 一并进 memory。
# 叠加 exp_rotloss 的 T2/T3 配方攻 lgbidex 旋转精度。
# 基于 v3_multitask.yaml；新增/改动键：model.joint_hand_denoise、
# model.flow_loss_task_scales、model.rot_geodesic、paths.output_dir。
# ⚠️ joint=true 的 flow_transformer 多出 cross_hand_attn 参数：不能 strict 加载
# 旧（非 joint）ckpt —— 本 run 从零训练。
# 启动（tmux + 空闲卡）：
#   tmux new -d -s p3_joint_rot
#   tmux send-keys -t p3_joint_rot 'cd /home/jiaxuan/exp-pami/test && CUDA_VISIBLE_DEVICES=<idle> \
#     /mnt/conda/jiaxuan/miniconda3/envs/dexvlg/bin/python train.py \
#     --config configs/p3_joint_rot.yaml \
#     2>&1 | tr "\r" "\n" >> outputs/p3_joint_rot/launch.log' Enter

# ─── Model ────────────────────────────────────────────────────────────
model:
  architecture: latent_ar

  # ★ A1：联合双手 flow 去噪。在场手（1 或 2 只）作为多 query 一次联合去噪，
  # 同一样本共享同一 t；query 间经 flow transformer 注意力互相可见
  # （cross_hand_attn 由该键自动派生为开启）。false = 原逐手顺序去噪（逐位不变）。
  joint_hand_denoise: true

  # Point cloud encoder (PointNet++)
  pc_in_channels: 3          # xyz-only
  pc_feature_dim: 256
  num_pc_tokens: 64

  # Language model
  language_backbone: modernbert
  bert_model: "pretrained_models/ModernBERT-base"
  bert_dim: 768               # must equal the encoder hidden_size
  freeze_bert_embeddings: false
  lang_padding: max_length
  mask_pad_tokens: true

  # Fusion transformer
  fusion_depth: 4

  # Flow-Matching Transformer（joint 下在场手一次联合 forward）
  flow_hidden_dim: 256
  flow_depth: 6
  flow_heads: 8

  joint_dim: 22               # Shadow Hand DOF

  # Per-element flow-loss weights (joints otherwise dominate the MSE).
  flow_loss_component_weights:
    translation: 3.0
    rotation: 6.0
    joint: 1.0

  # ★ T2：仅 lgbidex 的 rotation 分量在 flow_loss_component_weights 之上再 ×2。
  flow_loss_task_scales:
    lgbidex:
      rotation: 2.0

  # ★ T3：旋转测地辅助损失，只对 lgbidex 开，t>0.3 门控（t→0 时 x̂1 噪声大）。
  # joint 路径下按 query（每只在场手）计入。
  rot_geodesic:
    weight: 0.5
    task_types: [lgbidex]
    t_min: 0.3

  # Autoregressive latent reasoner (Coconut-style thinking + per-hand steps).
  # 决策链（presence/side）在 joint 下保持原样：训练 teacher-forced、推理逐 slot 贪心。
  reasoner:
    dim: 512
    depth: 4
    num_heads: 8
    num_thinking_tokens: 6
    max_hands: 2
    feedback_norm: true
    mlp_ratio: 4.0
    hand_cond_noise_std: 0.1
    aux_probe:
      enabled: false
      hidden_dim: 256
      num_task_types: 4

  # Total-loss weights for the latent_ar objective.
  loss_weights:
    flow: 1.0
    presence: 0.5
    side: 0.5
    probe: 0.1

  # latent_ar 下该块被忽略（模型内派生：enabled=true，
  # cross_hand_attn=joint_hand_denoise）；保留仅为与旧配置对齐可读。
  hand_interaction:
    enabled: true
    cross_hand_attn: false

  # Classifier-Free Guidance off for this run.
  cfg:
    drop_prob: 0.0
    guidance_scale: 1.0

  # Implicit affordance attention (as in the v2 runs).
  affordance:
    enabled: true
    hidden_dim: 192

# ─── Data ─────────────────────────────────────────────────────────────
data:
  train_data: "/home/jiaxuan/data/pose_data/train_fuse_v2_split.json"
  val_data: "/home/jiaxuan/data/pose_data/val_fuse_v2_split.json"
  test_data: "/home/jiaxuan/data/pose_data/test_fuse_v2.json"
  mesh_root: "/home/jiaxuan/data/oakink_obj/processed_data"
  multi_task: true
  n_points: 4096
  augment: false
  point_cloud_source: mesh_sample          # auto | colored_ply | mesh_sample
  point_cloud_color_mode: fill
  point_cloud_color_fill: 0.4
  center_on_object: true
  obj_pose_quaternion_order: wxyz
  normalization:
    enabled: true
    mode: relquantile11
    stats_path: tools/norm_stats_v3.json

# ─── Training ─────────────────────────────────────────────────────────
training:
  epochs: 200
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  grad_clip: 1.0

  optimizer: "adamw"
  scheduler: "cosine"
  num_workers: 12
  persistent_workers: true
  prefetch_factor: 2
  seed: 42

  ema:
    enabled: false
    decay: 0.9999

  precision: bf16
  fp16: true
  log_interval: 5000
  val_interval: 5
  val_max_batches: 200
  val_decision_max_batches: 10
  keep_best_k: 3
  save_interval: 10

  # 训练期质量信号：禁用 validate（组内最小匹配对 bench 退化零报警，已实证），
  # 改为每 20 epoch 异步 bench 子集（0 影响：不阻塞、不占训练卡、无空闲卡自动 skip）。
  validate_enabled: false
  bench_eval:
    enabled: true
    interval: 20            # e19,e39,...（与 save_interval=10 对齐，直接用 epoch_XXXX.pt）
    channels: "left,right,lgbidex,bidex"   # 四通道都盯（防单通道回归，如 rotloss 的 bidex -4.7）
    max_num: 6000           # 每通道 eval 截断 ≈1200 组×5
    gpu: ""                 # 自动找空闲卡（排除训练卡；找不到则 skip）
    n_worker: 48

  val_score_weights:
    translation: 3.0
    rotation: 6.0
    joint: 1.0
    structure: 1.0
    relative: 1.0
  val_score_reduce: macro

  val_group_min: true

  epoch_sampling:
    enabled: true
    group_keys: [obj_id, pose_id, scale_id, guidance]
    samples_per_group: 1
    val_samples_per_group: 1
    scenario_key: task_type
    scenario_shares:
      left: 0.15
      right: 0.15
      lgbidex: 0.35
      bidex: 0.35
    epoch_size: null

# ─── Inference ────────────────────────────────────────────────────────
inference:
  num_steps: 10               # Euler ODE steps（joint 下双手同积分）
  presence_threshold: 0.5     # sigmoid threshold for emitting hand slot 1
  batch_size: 256

# ─── Paths ────────────────────────────────────────────────────────────
paths:
  output_dir: "outputs/p3_joint_rot"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
