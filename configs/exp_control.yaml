# exp_control — 对照组：无任何改动的 warm-start 微调（epochs=20）。
# 目的：剥离"fresh optimizer + 20 epoch 微调"本身的效应，为 rotloss/cfg01/noise03/v1mix
# 的微调对比提供正确基线（bench 对比不再依赖连续训练的 e94）。
# 除 epochs/output_dir 外与 v3_multitask.yaml 完全一致（noise=0.1, aux_probe=false）。
model:
  architecture: latent_ar

  # Point cloud encoder (PointNet++)
  pc_in_channels: 3          # xyz-only
  pc_feature_dim: 256
  num_pc_tokens: 64

  # Language model
  language_backbone: modernbert
  bert_model: "pretrained_models/ModernBERT-base"
  bert_dim: 768               # must equal the encoder hidden_size
  freeze_bert_embeddings: false
  lang_padding: max_length
  mask_pad_tokens: true

  # Fusion transformer
  fusion_depth: 4

  # Flow-Matching Transformer (one call per hand under latent_ar)
  flow_hidden_dim: 256
  flow_depth: 6
  flow_heads: 8

  joint_dim: 22               # Shadow Hand DOF

  # Per-element flow-loss weights (joints otherwise dominate the MSE).
  flow_loss_component_weights:
    translation: 3.0
    rotation: 6.0
    joint: 1.0

  # Autoregressive latent reasoner (Coconut-style thinking + per-hand steps).
  reasoner:
    dim: 512
    depth: 4
    num_heads: 8
    num_thinking_tokens: 6
    max_hands: 2
    feedback_norm: true
    mlp_ratio: 4.0
    # ★ T5：0.1 → 0.3，训练/推理条件分布对齐（曝光偏差 → rel_r）。
    hand_cond_noise_std: 0.1
    # ★ T6：辅助探针开启（task_type CE + log L_obj 回归；probe 权重 0.1）。
    aux_probe:
      enabled: false
      hidden_dim: 256
      num_task_types: 4

  # Total-loss weights for the latent_ar objective.
  loss_weights:
    flow: 1.0
    presence: 0.5
    side: 0.5
    probe: 0.1

  hand_interaction:
    enabled: true
    cross_hand_attn: false

  # Classifier-Free Guidance off for this run.
  cfg:
    drop_prob: 0.0
    guidance_scale: 1.0

  # Implicit affordance attention (as in the v2 runs).
  affordance:
    enabled: true
    hidden_dim: 192

# ─── Data ─────────────────────────────────────────────────────────────
data:
  train_data: "/home/jiaxuan/data/pose_data/train_fuse_v2_split.json"
  val_data: "/home/jiaxuan/data/pose_data/val_fuse_v2_split.json"
  test_data: "/home/jiaxuan/data/pose_data/test_fuse_v2.json"
  mesh_root: "/home/jiaxuan/data/oakink_obj/processed_data"
  multi_task: true
  n_points: 4096
  augment: false
  point_cloud_source: mesh_sample          # auto | colored_ply | mesh_sample
  point_cloud_color_mode: fill
  point_cloud_color_fill: 0.4
  center_on_object: true
  obj_pose_quaternion_order: wxyz
  normalization:
    enabled: true
    mode: relquantile11
    stats_path: tools/norm_stats_v3.json

# ─── Training ─────────────────────────────────────────────────────────
training:
  epochs: 20                  # ★ warm-start 微调短训（--init-weights epoch_0079.pt）
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  grad_clip: 1.0

  optimizer: "adamw"
  scheduler: "cosine"
  num_workers: 12
  persistent_workers: true
  prefetch_factor: 2
  seed: 42

  ema:
    enabled: false
    decay: 0.9999

  precision: bf16
  fp16: true
  log_interval: 5000
  val_interval: 5
  val_max_batches: 200
  val_decision_max_batches: 10
  keep_best_k: 3
  save_interval: 10

  val_score_weights:
    translation: 3.0
    rotation: 6.0
    joint: 1.0
    structure: 1.0
    relative: 1.0
  val_score_reduce: macro

  val_group_min: true

  epoch_sampling:
    enabled: true
    group_keys: [obj_id, pose_id, scale_id, guidance]
    samples_per_group: 1
    val_samples_per_group: 1
    scenario_key: task_type
    scenario_shares:
      left: 0.15
      right: 0.15
      lgbidex: 0.35
      bidex: 0.35
    epoch_size: null

# ─── Inference ────────────────────────────────────────────────────────
inference:
  num_steps: 10               # Euler ODE steps per hand
  presence_threshold: 0.5     # sigmoid threshold for emitting hand slot 1
  batch_size: 256

# ─── Paths ────────────────────────────────────────────────────────────
paths:
  output_dir: "outputs/exp_control"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
