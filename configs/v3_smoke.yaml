# DexVLG v3 multi-task SMOKE configuration.
# Same architecture/data pipeline as v3_multitask.yaml, but train AND val both
# point at test_fuse_v1.json, with 1 epoch, a small balanced epoch, tiny batches and
# capped validation — for a fast end-to-end pipeline check (all 4 task types
# forward/backward + full validation metrics), not for real training.

# ─── Model ────────────────────────────────────────────────────────────
model:
  architecture: latent_ar

  pc_in_channels: 3
  pc_feature_dim: 256
  num_pc_tokens: 64

  language_backbone: modernbert
  bert_model: "pretrained_models/ModernBERT-base"
  bert_dim: 768
  freeze_bert_embeddings: false
  # Mirrors v3_multitask.yaml (smoke must exercise the same code path).
  # lang_padding: fixed 128-token padding (batch-invariant inference);
  # mask_pad_tokens: 改此项需重训，旧 ckpt 在 pad 可见分布下训练。
  lang_padding: max_length
  mask_pad_tokens: true

  fusion_depth: 4

  flow_hidden_dim: 256
  flow_depth: 6
  flow_heads: 8

  joint_dim: 22

  flow_loss_component_weights:
    translation: 3.0
    rotation: 6.0
    joint: 1.0

  reasoner:
    dim: 512
    depth: 4
    num_heads: 8
    num_thinking_tokens: 6
    max_hands: 2
    feedback_norm: true
    mlp_ratio: 4.0
    hand_cond_noise_std: 0.1
    aux_probe:
      enabled: false
      hidden_dim: 256
      num_task_types: 4

  loss_weights:
    flow: 1.0
    presence: 0.5
    side: 0.5
    probe: 0.1

  hand_interaction:
    enabled: true
    cross_hand_attn: false

  cfg:
    drop_prob: 0.0
    guidance_scale: 1.0

  affordance:
    enabled: true
    hidden_dim: 192

# ─── Data ─────────────────────────────────────────────────────────────
data:
  train_data: "/home/jiaxuan/data/pose_data/test_fuse_v1.json"   # smoke: train on the test split
  val_data: "/home/jiaxuan/data/pose_data/test_fuse_v1.json"
  test_data: "/home/jiaxuan/data/pose_data/test_fuse_v1.json"
  mesh_root: "/home/jiaxuan/data/oakink_obj/processed_data"
  multi_task: true
  n_points: 4096
  augment: false
  point_cloud_source: mesh_sample
  point_cloud_color_mode: fill
  point_cloud_color_fill: 0.4
  center_on_object: true
  obj_pose_quaternion_order: wxyz
  normalization:
    enabled: true
    mode: relquantile11
    stats_path: tools/norm_stats_v3.json

# ─── Training ─────────────────────────────────────────────────────────
training:
  epochs: 1
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 10
  grad_clip: 1.0

  optimizer: "adamw"
  scheduler: "cosine"
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 2
  seed: 42

  ema:
    enabled: false
    decay: 0.9999

  precision: bf16
  fp16: true
  log_interval: 10
  val_interval: 1
  val_max_batches: 4
  val_decision_max_batches: 0   # 0 = decision metrics on all validated batches
  keep_best_k: 1
  save_interval: 0

  val_score_weights:
    translation: 3.0
    rotation: 6.0
    joint: 1.0
    structure: 1.0
    relative: 1.0
  val_score_reduce: macro

  val_group_min: true

  epoch_sampling:
    enabled: true
    group_keys: [obj_id, pose_id, scale_id, guidance]
    samples_per_group: 1
    val_samples_per_group: 1
    scenario_key: task_type
    scenario_shares:
      left: 0.15
      right: 0.15
      lgbidex: 0.35
      bidex: 0.35
    epoch_size: 2048            # small balanced epoch: 128 steps at batch 16

# ─── Inference ────────────────────────────────────────────────────────
inference:
  num_steps: 10
  presence_threshold: 0.5
  batch_size: 64

# ─── Paths ────────────────────────────────────────────────────────────
paths:
  output_dir: "outputs_v3_smoke"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
